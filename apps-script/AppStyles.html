<style>
:root {
  --nu-purple: #8a05be;
  --nu-purple-dark: #6b0494;
  --nu-purple-soft: #f3e8fa;
  --nu-teal: #0d9488;
  --nu-teal-soft: #e6f7f5;
  --nu-green: #16a34a;
  --nu-green-soft: #e8f8ef;
  --nu-orange: #ea580c;
  --status-waiting: #dc2626;
  --status-waiting-soft: #fee2e2;
  --status-tratativa: #8a05be;
  --status-tratativa-soft: #f3e8fa;
  --status-done: #16a34a;
  --status-done-soft: #e8f8ef;
  --status-denied: #667085;
  --status-denied-soft: #f2f4f7;
  --status-pending: #ea580c;
  --status-pending-soft: #ffedd5;
  --bg: #f3f1f6;
  --card: #ffffff;
  --text: #1f1a24;
  --muted: #6b6575;
  --border: #e7e2ee;
  --shadow: 0 8px 24px rgba(40, 20, 60, 0.06);
  --radius: 14px;
  --font: 'Manrope', system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body,
#root {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

button,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

h1,
h2,
h3,
p {
  margin: 0;
}

.app-shell,
.leadership-layout {
  min-height: 100vh;
}

.page {
  padding: 20px 24px 40px;
  max-width: 1400px;
  margin: 0 auto;
}

/* Header */
.app-header {
  background: linear-gradient(135deg, #8200b8 0%, #9b20d0 100%);
  color: white;
  padding: 18px 24px 0;
}

.header-top {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
  flex-wrap: wrap;
  max-width: 1400px;
  margin: 0 auto;
}

.brand-block {
  display: flex;
  gap: 12px;
  align-items: center;
}

.nu-mark {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.18);
  display: grid;
  place-items: center;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.app-header h1 {
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.subtitle {
  opacity: 0.85;
  font-size: 0.85rem;
  margin-top: 2px;
}

.header-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.role-switch {
  display: inline-flex;
  background: rgba(255, 255, 255, 0.14);
  border-radius: 999px;
  padding: 4px;
  gap: 4px;
}

.role-switch button {
  border: 0;
  background: transparent;
  color: white;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.9rem;
}

.role-switch button.locked {
  opacity: 0.55;
  cursor: not-allowed;
  gap: 6px;
}

.session-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 8px 24px;
  background: #1b0b24;
  color: rgba(255, 255, 255, 0.92);
  font-size: 0.85rem;
}

.session-bar em {
  font-style: normal;
  opacity: 0.7;
}

.session-bar .chip {
  background: rgba(255, 255, 255, 0.12);
  border-color: transparent;
  color: white;
}

.login-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(circle at top left, rgba(138, 5, 190, 0.18), transparent 40%),
    var(--bg);
}

.login-card {
  width: min(440px, 100%);
  padding: 28px 24px;
  display: grid;
  gap: 12px;
}

.login-card h1 {
  font-size: 1.4rem;
  text-align: center;
  margin-bottom: 4px;
}

.login-card form {
  display: grid;
  gap: 10px;
  margin-top: 8px;
}

.login-card input {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
}

.login-error {
  color: #b42318 !important;
  font-size: 0.85rem !important;
}

.demo-users {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.demo-users p {
  width: 100%;
  font-size: 0.8rem;
  margin: 0;
}

.page-center {
  min-height: 40vh;
  display: grid;
  place-items: center;
}

.badge {
  background: var(--nu-orange);
  color: white;
  border-radius: 999px;
  font-size: 0.72rem;
  padding: 1px 7px;
  min-width: 1.4rem;
  text-align: center;
}

.role-switch button.active .badge {
  background: var(--nu-purple);
}

.btn-ghost {
  border: 0;
  background: rgba(255, 255, 255, 0.18);
  color: white;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 12px;
  font-weight: 600;
}

.btn-ghost:hover {
  background: rgba(255, 255, 255, 0.26);
}

.header-nav-panel {
  max-width: 1400px;
  margin: 16px auto 0;
  padding: 12px 14px 14px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 16px;
  backdrop-filter: blur(10px);
}

.header-tabs-toolbar {
  display: block;
}

.header-tabs-row {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: 8px 10px;
}

.header-tabs-section {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: 6px;
}

.header-tabs-section-main {
  flex: 0 0 auto;
  align-items: center;
}

.header-tabs-section-channels {
  flex: 1 1 420px;
  min-width: 0;
}

.header-tabs-section-stack {
  flex: 0 0 168px;
  flex-direction: column;
  justify-content: stretch;
  gap: 6px;
}

.header-tabs-divider {
  width: 1px;
  align-self: stretch;
  min-height: 36px;
  background: rgba(255, 255, 255, 0.22);
  flex-shrink: 0;
}

.tab {
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.92);
  padding: 9px 12px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 600;
  font-size: 0.84rem;
  line-height: 1.3;
  text-align: center;
  white-space: normal;
  transition:
    background 0.15s,
    border-color 0.15s,
    box-shadow 0.15s,
    transform 0.15s;
}

.tab:hover:not(.active) {
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.24);
}

.tab-pill {
  white-space: nowrap;
  font-weight: 700;
  min-height: 42px;
}

.tab-pill-compact {
  width: 100%;
  min-height: 36px;
  padding: 7px 10px;
  font-size: 0.78rem;
  justify-content: flex-start;
}

.tab-channel {
  flex: 1 1 92px;
  max-width: 118px;
  min-height: 36px;
  padding: 6px 8px;
  font-size: 0.76rem;
  line-height: 1.25;
  word-break: break-word;
  overflow-wrap: anywhere;
  hyphens: auto;
}

.tab.active {
  background: white;
  color: var(--nu-purple);
  border-color: white;
  box-shadow: 0 6px 18px rgba(24, 0, 48, 0.18);
}

.updated-at {
  max-width: 1400px;
  margin: 10px auto 0;
  padding: 0 2px 14px;
  font-size: 0.82rem;
  opacity: 0.82;
}

@media (max-width: 900px) {
  .header-tabs-row {
    flex-direction: column;
  }

  .header-tabs-section-stack {
    flex: 1 1 auto;
    flex-direction: row;
    width: 100%;
  }

  .tab-pill-compact {
    flex: 1 1 140px;
  }

  .header-tabs-divider {
    display: none;
  }

  .header-tabs-section-main,
  .header-tabs-section-channels {
    flex: 1 1 100%;
  }

  .header-tabs-section-channels {
    padding-top: 2px;
    border-top: 1px solid rgba(255, 255, 255, 0.14);
  }
}

/* Cards & chips */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.chip {
  border: 1px solid var(--border);
  background: white;
  color: var(--muted);
  border-radius: 999px;
  padding: 7px 12px;
  font-weight: 600;
  font-size: 0.85rem;
}

.chip.active {
  background: var(--nu-purple);
  border-color: var(--nu-purple);
  color: white;
}

.chip.active.teal {
  background: var(--nu-teal);
  border-color: var(--nu-teal);
}

.btn-primary,
.btn-secondary {
  border: 0;
  border-radius: 12px;
  padding: 10px 16px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-primary {
  background: var(--nu-purple);
  color: white;
}

.btn-primary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-secondary {
  background: var(--nu-purple-soft);
  color: var(--nu-purple);
}

/* Analyst */
.analyst-layout {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.joot-board {
  padding: 16px;
}

.joot-board-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.joot-board-head h2 {
  font-size: 1.05rem;
}

.joot-board-head p {
  color: var(--muted);
  font-size: 0.85rem;
  margin-top: 2px;
}

.joot-total-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.totals-board {
  padding: 16px;
}

.totals-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}

.joot-total {
  border: 1px solid var(--border);
  background: white;
  border-radius: 14px;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 600;
  color: var(--muted);
  text-align: center;
}

.joot-total strong {
  display: block;
  width: 100%;
  font-size: 1.6rem;
  color: var(--text);
  font-weight: 800;
  line-height: 1.1;
}

.joot-total-pct {
  display: block;
  width: 100%;
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--muted);
}

.joot-total-period {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  width: 100%;
  margin-top: 2px;
  padding-top: 6px;
  border-top: 1px dashed var(--border);
}

.joot-total-period-line {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--muted);
  line-height: 1.3;
  opacity: 0.92;
}

.joot-total-pct-hint {
  font-size: 0.72rem;
  font-weight: 600;
  opacity: 0.85;
}

.joot-total.st-pendente .joot-total-pct { color: var(--status-waiting); }
.joot-total.st-em_atendimento .joot-total-pct { color: var(--status-tratativa); }
.joot-total.st-concluido .joot-total-pct { color: var(--status-done); }
.joot-total.st-sem_retorno .joot-total-pct { color: var(--status-pending); }
.joot-total.st-negado .joot-total-pct { color: var(--status-denied); }

.joot-total .status-name {
  font-size: 0.82rem;
  font-weight: 700;
  width: 100%;
}

.joot-total.active {
  box-shadow: inset 0 0 0 2px var(--border);
}

.status-name.st-pendente { color: var(--status-waiting); }
.status-name.st-em_atendimento { color: var(--status-tratativa); }
.status-name.st-concluido { color: var(--status-done); }
.status-name.st-sem_retorno { color: var(--status-pending); }
.status-name.st-negado { color: var(--status-denied); }

.joot-total.st-pendente,
.joot-total.st-em_atendimento,
.joot-total.st-concluido,
.joot-total.st-sem_retorno,
.joot-total.st-negado {
  background: white;
  border-color: var(--border);
  color: var(--muted);
}

.joot-total.st-pendente strong,
.joot-total.st-em_atendimento strong,
.joot-total.st-concluido strong,
.joot-total.st-sem_retorno strong,
.joot-total.st-negado strong {
  color: var(--text);
}

.joot-total.st-pendente.active { box-shadow: inset 0 0 0 2px var(--status-waiting); }
.joot-total.st-em_atendimento.active { box-shadow: inset 0 0 0 2px var(--status-tratativa); }
.joot-total.st-concluido.active { box-shadow: inset 0 0 0 2px var(--status-done); }
.joot-total.st-sem_retorno.active { box-shadow: inset 0 0 0 2px var(--status-pending); }
.joot-total.st-negado.active { box-shadow: inset 0 0 0 2px var(--status-denied); }

.joot-menu {
  display: none;
}

.joot-rows {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.joot-row {
  display: grid;
  grid-template-columns: minmax(140px, 1fr) repeat(5, minmax(88px, 1fr));
  gap: 8px;
  align-items: center;
  border: 1px solid var(--border);
  background: #faf9fc;
  border-radius: 12px;
  padding: 10px 12px;
  position: relative;
  overflow: hidden;
}

.joot-row::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
}

.joot-row.accent-purple::before { background: var(--nu-purple); }
.joot-row.accent-teal::before { background: var(--nu-teal); }
.joot-row.accent-green::before { background: var(--nu-green); }
.joot-row.accent-orange::before { background: var(--nu-orange); }
.joot-row.accent-blue::before { background: #2563eb; }

.joot-row.active {
  border-color: #d2a6ea;
  background: #f7f0fb;
}

.joot-row-header {
  background: transparent;
  border: 0;
  padding: 4px 12px 12px;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.01em;
  margin-bottom: 4px;
}

.joot-row-header::before {
  display: none;
}

.joot-row-channel {
  display: grid;
  gap: 2px;
  padding-left: 6px;
  min-width: 0;
}

.joot-hash {
  font-size: 1rem;
  font-weight: 800;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.joot-row-header .joot-row-col {
  text-align: center;
  line-height: 1.25;
}

.joot-row-stat {
  border: 1px solid var(--border);
  background: white;
  border-radius: 10px;
  padding: 8px 6px;
  text-align: center;
  color: var(--text);
}

.joot-row-stat strong {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--text);
}

.joot-row-stat.pendente,
.joot-row-stat.em_atendimento,
.joot-row-stat.concluido,
.joot-row-stat.sem_retorno,
.joot-row-stat.negado {
  background: white;
  border-color: var(--border);
  color: var(--text);
}

.joot-row-stat.pendente strong,
.joot-row-stat.em_atendimento strong,
.joot-row-stat.concluido strong,
.joot-row-stat.sem_retorno strong,
.joot-row-stat.negado strong {
  color: var(--text);
}

.joot-row-stat.active {
  box-shadow: inset 0 0 0 2px #c4c1cc;
  background: #faf9fc;
}

.joot-row-stat.pendente.active {
  box-shadow: inset 0 0 0 2px var(--status-waiting);
}
.joot-row-stat.em_atendimento.active {
  box-shadow: inset 0 0 0 2px var(--status-tratativa);
}
.joot-row-stat.concluido.active {
  box-shadow: inset 0 0 0 2px var(--status-done);
}
.joot-row-stat.sem_retorno.active {
  box-shadow: inset 0 0 0 2px var(--status-pending);
}
.joot-row-stat.negado.active {
  box-shadow: inset 0 0 0 2px var(--status-denied);
}

.joot-row-stat.pendente.active strong,
.joot-row-stat.em_atendimento.active strong,
.joot-row-stat.concluido.active strong,
.joot-row-stat.sem_retorno.active strong,
.joot-row-stat.negado.active strong {
  color: var(--text);
}

.question-asker {
  color: var(--muted) !important;
  font-size: 0.85rem !important;
  margin-bottom: 8px !important;
}

.slack-message {
  margin: 0;
  padding: 12px 14px;
  border-left: 3px solid var(--nu-purple);
  background: #f7f2fb;
  border-radius: 0 10px 10px 0;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.5;
  color: var(--text);
  font-size: 0.95rem;
}

.solicitation-who strong {
  color: var(--nu-purple);
  font-weight: 800;
}

.solicitation-fields {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.solicitation-field-row {
  line-height: 1.45;
}

.solicitation-field-row strong {
  color: var(--text);
  font-weight: 800;
}

.reaction-actions {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0;
}

@media (max-width: 1100px) {
  .totals-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.rx-btn {
  border: 1px solid var(--border);
  background: white;
  border-radius: 12px;
  padding: 12px 8px;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--text);
  display: grid;
  gap: 4px;
  place-items: center;
}

.rx-btn small {
  font-size: 0.68rem;
  font-weight: 600;
  color: inherit;
  opacity: 0.85;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.rx-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.rx-btn.verificando {
  background: var(--status-tratativa-soft);
  border-color: #d2a6ea;
  color: var(--status-tratativa);
}

.rx-btn.jobdone {
  background: var(--status-done-soft);
  border-color: #86efac;
  color: var(--status-done);
}

.rx-btn.pendente {
  background: var(--status-pending-soft);
  border-color: #fdba74;
  color: var(--status-pending);
}

.rx-btn.negado {
  background: var(--status-denied-soft);
  border-color: #d0d5dd;
  color: var(--status-denied);
}

.rx-btn.verificando:not(:disabled):hover,
.rx-btn.verificando:focus-visible {
  filter: brightness(0.97);
  box-shadow: inset 0 0 0 1px var(--status-tratativa);
}

.rx-btn.jobdone:not(:disabled):hover,
.rx-btn.jobdone:focus-visible {
  filter: brightness(0.97);
  box-shadow: inset 0 0 0 1px var(--status-done);
}

.rx-btn.pendente:not(:disabled):hover,
.rx-btn.pendente:focus-visible {
  filter: brightness(0.97);
  box-shadow: inset 0 0 0 1px var(--status-pending);
}

.rx-btn.negado:not(:disabled):hover,
.rx-btn.negado:focus-visible {
  filter: brightness(0.97);
  box-shadow: inset 0 0 0 1px var(--status-denied);
}

@media (max-width: 900px) {
  .totals-grid {
    grid-template-columns: 1fr 1fr;
  }
  .joot-row,
  .joot-row-header {
    grid-template-columns: 1fr;
  }
  .joot-row-col {
    display: none;
  }
  .joot-row-stat {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .joot-row-stat::before {
    content: attr(title);
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 700;
  }
  .reaction-actions {
    grid-template-columns: 1fr 1fr;
  }
}

.treatment-meta {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 16px;
  margin-top: 12px;
}

.treatment-meta .meta-label {
  display: block;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  margin-bottom: 2px;
}

.treatment-meta strong {
  font-size: 0.92rem;
}

.job-link-box {
  margin-top: 12px;
  width: 100%;
}

.job-link-row {
  display: flex;
  gap: 8px;
  align-items: stretch;
  margin-top: 4px;
  flex-wrap: wrap;
}

.job-link-input {
  flex: 1 1 220px;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 0.82rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--text);
  background: white;
}

.job-link-input:focus {
  outline: 2px solid var(--purple);
  outline-offset: 1px;
}

.job-link-copy {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.job-link-open {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
  color: var(--purple);
  font-size: 0.85rem;
  font-weight: 600;
  white-space: nowrap;
  text-decoration: none;
}

.job-link-open:hover {
  background: var(--purple-soft, #f3e8fa);
}

@media (max-width: 700px) {
  .treatment-meta {
    grid-template-columns: 1fr;
  }
}

.mini-kpi,
.kpi-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

.mini-kpi::before,
.kpi-card::before {
  content: '';
  position: absolute;
  inset: 0 0 auto 0;
  height: 4px;
}

.accent-purple::before {
  background: var(--nu-purple);
}
.accent-teal::before {
  background: var(--nu-teal);
}
.accent-green::before {
  background: var(--nu-green);
}
.accent-orange::before {
  background: var(--nu-orange);
}
.accent-blue::before {
  background: #2563eb;
}

.kpi-label {
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}

.kpi-value {
  font-size: 1.85rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 8px 0 4px;
}

.kpi-sub {
  color: var(--muted);
  font-size: 0.85rem;
}

.kpi-icon,
.kpi-icon-wrap {
  position: absolute;
  top: 14px;
  right: 14px;
  color: var(--muted);
  opacity: 0.7;
}

.kpi-card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.analyst-main {
  display: grid;
  grid-template-columns: minmax(400px, 0.95fr) minmax(0, 1.25fr);
  gap: 16px;
  min-height: 640px;
}

.queue-header {
  padding: 16px 16px 8px;
}

.queue-header h2 {
  font-size: 1.05rem;
}

.queue-header p {
  color: var(--muted);
  font-size: 0.82rem;
  margin-top: 4px;
  word-break: break-all;
}

.queue-scope {
  color: var(--nu-purple) !important;
  font-weight: 600;
  word-break: normal !important;
}

.channel-hint {
  margin: 4px 16px 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: #f7f2fb;
  border: 1px solid #e7d7f3;
  display: grid;
  gap: 4px;
}

.channel-hint span {
  font-size: 0.75rem;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.channel-hint p {
  margin: 0;
  font-size: 0.85rem;
  color: var(--text);
  line-height: 1.4;
}

.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 16px;
}

.filter-row.compact {
  padding-top: 4px;
}

.job-list {
  list-style: none;
  margin: 0;
  padding: 8px;
  max-height: 560px;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.job-item {
  width: 100%;
  text-align: left;
  border: 1px solid var(--border);
  background: #faf9fc;
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.job-item:hover,
.job-item.active {
  border-color: #d2a6ea;
  background: var(--nu-purple-soft);
}

.job-item-top,
.job-item-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.job-item-meta {
  justify-content: flex-start;
  color: var(--muted);
  font-size: 0.8rem;
}

.job-id {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--muted);
}

.status-pill,
.team-pill {
  font-size: 0.72rem;
  font-weight: 700;
  border-radius: 999px;
  padding: 3px 8px;
}

.status-pill.pendente {
  background: var(--status-waiting-soft);
  color: var(--status-waiting);
}
.status-pill.em_atendimento {
  background: var(--status-tratativa-soft);
  color: var(--status-tratativa);
}
.status-pill.concluido {
  background: var(--status-done-soft);
  color: var(--status-done);
}
.status-pill.negado {
  background: var(--status-denied-soft);
  color: var(--status-denied);
}
.status-pill.sem_retorno {
  background: var(--status-pending-soft);
  color: var(--status-pending);
}

.team-pill.gpd {
  background: var(--nu-purple-soft);
  color: var(--nu-purple);
}
.team-pill.ic {
  background: var(--nu-teal-soft);
  color: var(--nu-teal);
}

.empty-state {
  color: var(--muted);
  text-align: center;
  padding: 24px 12px;
}

.job-workspace {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.empty-workspace {
  margin: auto;
  text-align: center;
  color: var(--muted);
  display: grid;
  gap: 8px;
  place-items: center;
  padding: 40px 20px;
}

.empty-workspace h2 {
  color: var(--text);
}

.workspace-header {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
  flex-wrap: wrap;
}

.workspace-header h2 {
  margin-top: 8px;
  font-size: 1.35rem;
}

.asker {
  color: var(--muted);
  margin-top: 6px;
  font-size: 0.9rem;
}

.workspace-actions {
  display: flex;
  gap: 8px;
}

.question-box,
.answer-box {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  background: #faf9fc;
}

.question-box h3,
.answer-box h3 {
  font-size: 0.85rem;
  margin-bottom: 8px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.answer-box textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  resize: vertical;
  margin-bottom: 12px;
  background: white;
}

.answer-box textarea:focus {
  outline: 2px solid #d7a8ef;
  border-color: var(--nu-purple);
}

.banner {
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 0.9rem;
  border: 1px solid var(--border);
  background: white;
}

.banner.error {
  background: #fef3f2;
  border-color: #fecdca;
  color: #b42318;
}

.banner.demo {
  background: #fff8eb;
  border-color: #f9dbaf;
  color: #9a3412;
}

.banner.slack {
  background: #eefbf8;
  border-color: #99e6db;
  color: #0f766e;
}

.banner code,
.page-hint code {
  font-size: 0.85em;
}

.page-hint {
  color: var(--muted);
}

.chip-count {
  margin-left: 6px;
  background: rgba(0, 0, 0, 0.08);
  border-radius: 999px;
  padding: 0 6px;
  font-size: 0.75rem;
}

.chip.active .chip-count {
  background: rgba(255, 255, 255, 0.22);
}

.channel-tabs {
  max-height: none;
}

.timeline-panel {
  border: 1px dashed #d9cfea;
  border-radius: 12px;
  padding: 12px 14px;
  background: #fcfaff;
}

.timeline-panel h3 {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  margin-bottom: 8px;
}

.timeline-panel ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}

.timeline-panel li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 0.9rem;
}

.timeline-panel li span {
  color: var(--muted);
}

.workspace-actions.wrap {
  flex-wrap: wrap;
}

.btn-secondary.danger {
  background: #fde8e8;
  color: #b42318;
}

.deny-input {
  width: 100%;
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
}

.deny-panel {
  margin-top: 14px;
  padding: 14px 16px;
  border-radius: 12px;
  background: #ececec;
  border: 1px solid #d0d0d0;
}

.deny-panel-msg {
  margin: 0 0 10px;
  color: #4a4a4a;
  font-size: 0.92rem;
  font-weight: 600;
  line-height: 1.35;
}

.deny-panel .deny-input {
  margin-top: 0;
  background: #fff;
  resize: vertical;
  min-height: 72px;
  font: inherit;
}

.deny-panel-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.deny-panel-actions .deny-confirm {
  background: #b42318;
  border-color: #b42318;
}

.deny-panel-actions .deny-confirm:hover {
  filter: brightness(0.95);
}

.cycle-card {
  margin-top: 16px;
  padding: 16px;
}

.cycle-card h3 {
  margin-bottom: 4px;
}

.table-scroll {
  overflow-x: auto;
  margin-top: 12px;
}

.cycle-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

.cycle-table th,
.cycle-table td {
  text-align: left;
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

.cycle-table th {
  color: var(--muted);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.muted-cell {
  color: var(--muted);
  font-size: 0.8rem;
  margin-top: 2px;
}

.asker a {
  color: var(--nu-purple);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* Leadership */
.filters-card {
  display: flex;
  flex-wrap: wrap;
  gap: 16px 24px;
  padding: 16px 18px;
  margin-top: 16px;
}

.leadership-filters-first {
  margin-top: 0;
}

.leadership-filters-panel {
  flex-direction: column;
  align-items: stretch;
  background: linear-gradient(180deg, #ffffff 0%, #fbf9fd 100%);
}

.leadership-filters-stack {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.leadership-filters-stack .leadership-filters-panel.filters-card,
.leadership-filters-stack .leadership-analyst-panel.filters-card {
  margin-top: 0;
}

.leadership-filters-panel.filters-card {
  gap: 0;
  padding: 12px 14px 14px;
  background: linear-gradient(180deg, #ffffff 0%, #fbf9fd 100%);
}

.leadership-filters-panel .filters-card-title {
  font-size: 0.92rem;
  color: var(--text);
}

.leadership-filters-panel .filter-body {
  gap: 7px;
}

.leadership-filters-panel .filter-row-compact {
  gap: 6px;
}

.leadership-filters-panel .filter-field-compact {
  min-height: 58px;
  padding: 7px 9px 6px;
  gap: 4px;
  border-radius: 10px;
}

.leadership-filters-panel .filter-field-compact .filter-label {
  font-size: 0.64rem;
}

.leadership-filters-panel .filter-field-compact .filter-control,
.leadership-filters-panel .filter-field-compact .filter-dropdown-trigger {
  min-height: 30px;
  padding: 5px 8px;
  font-size: 0.78rem;
  border-radius: 8px;
}

.leadership-filters-panel .filter-range-bar {
  padding: 7px 11px;
  border-radius: 10px;
  gap: 8px 10px;
}

.leadership-filters-panel .filter-range-item .filter-control {
  min-height: 28px;
  padding: 5px 7px;
  font-size: 0.76rem;
}

.leadership-filters-panel .filters-card-head {
  margin-bottom: 8px;
  padding-bottom: 8px;
}

.leadership-filters-panel .filter-period-summary {
  padding: 7px 10px;
  margin-top: 0;
  border-color: var(--border);
  background: #fafafa;
}

.leadership-filters-panel .filter-period-summary-label {
  color: var(--muted);
  font-weight: 800;
}

.leadership-filters-panel .filter-period-summary-line {
  font-size: 0.72rem;
  padding: 1px 6px;
  border-color: var(--border);
  color: var(--text);
  background: white;
}

.leadership-analyst-panel.filters-card {
  margin-top: 12px;
  padding: 10px 12px;
}

.leadership-filters-stack .leadership-analyst-panel.filters-card {
  padding: 8px 10px;
  background: white;
}

.filter-analyst-bar {
  padding: 14px 16px;
  min-height: 58px;
  width: 100%;
  gap: 12px 16px;
}

.leadership-filters-stack .filter-analyst-bar {
  padding: 10px 12px;
  min-height: 48px;
  gap: 10px 12px;
}

.leadership-filters-stack .filter-analyst-trigger {
  min-height: 34px;
}

.filter-analyst-picker {
  position: relative;
  flex: 1;
  min-width: 0;
}

.filter-analyst-trigger {
  width: 100%;
  min-height: 40px;
}

.filter-clear-btn-inline {
  flex-shrink: 0;
}

.filter-analyst-option {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.filter-analyst-menu {
  padding-top: 8px;
}

.filter-analyst-search-wrap {
  position: sticky;
  top: 0;
  z-index: 2;
  padding: 0 8px 8px;
  background: inherit;
  background: var(--card, #fff);
}

.filter-analyst-search {
  width: 100%;
  min-height: 34px;
  font-size: 0.86rem;
}

.filter-year-option {
  display: flex;
  width: 100%;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
  font: inherit;
}

.filter-year-option.is-selected {
  background: var(--filter-tone-soft, #f3e8fa);
  color: var(--filter-tone, #8a05be);
  font-weight: 700;
}

.filter-analyst-role {
  display: none;
}

.filter-tone-analyst {
  --filter-tone: #8a05be;
  --filter-tone-soft: #f3e8fa;
  --filter-tone-border: #e4ccf5;
  --filter-tone-ring: rgba(138, 5, 190, 0.12);
}

.filter-analyst-bar.filter-tone-analyst {
  border: 1px solid var(--filter-tone-border);
  border-left: 3px solid var(--filter-tone);
  border-radius: 12px;
  background: color-mix(in srgb, var(--filter-tone-soft) 42%, white);
}

.filter-analyst-bar.filter-tone-analyst .filter-range-bar-label {
  color: var(--filter-tone);
}

.filter-analyst-bar.filter-tone-analyst .filter-control {
  border-color: var(--filter-tone-border);
  background: color-mix(in srgb, var(--filter-tone-soft) 58%, white);
}

.filter-analyst-bar.filter-tone-analyst .filter-control:focus,
.filter-analyst-bar.filter-tone-analyst .filter-dropdown-trigger.is-open {
  border-color: var(--filter-tone);
  box-shadow: 0 0 0 3px var(--filter-tone-ring);
}

.filter-analyst-bar.filter-tone-analyst .filter-dropdown-trigger.has-value {
  color: var(--filter-tone);
  background: color-mix(in srgb, var(--filter-tone-soft) 72%, white);
  border-color: var(--filter-tone-border);
}

.filter-dropdown-trigger:disabled {
  opacity: 0.65;
  cursor: not-allowed;
}

.filters-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.filters-card-title {
  font-size: 1rem;
  font-weight: 800;
  margin: 0;
  color: var(--text);
}

.filter-clear-btn {
  border: 1px solid var(--border);
  background: white;
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 0.78rem;
  font-weight: 700;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}

.filter-clear-btn:hover {
  border-color: var(--nu-purple);
  color: var(--nu-purple);
  background: var(--nu-purple-soft);
}

.filter-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}

.filter-row-compact {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  align-items: stretch;
}

.filter-row-compact.filter-row-second {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.filter-field-compact {
  min-width: 0;
  max-width: none;
  min-height: 72px;
  padding: 10px 11px 9px;
  gap: 6px;
  border-radius: 12px;
  box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
}

.filter-field-compact .filter-label {
  min-height: 0;
  font-size: 0.7rem;
  text-align: center;
  width: 100%;
}

.filter-field-compact .filter-control {
  min-height: 36px;
  padding: 7px 10px;
  font-size: 0.82rem;
  border-radius: 10px;
  background: white;
}

.filter-range-bar {
  display: flex;
  align-items: center;
  gap: 10px 14px;
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--filter-tone-border, var(--border));
  border-left: 3px solid var(--filter-tone, var(--border));
  border-radius: 12px;
  background: color-mix(in srgb, var(--filter-tone-soft, #eff6ff) 48%, white);
  box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
}

.filter-range-bar-label {
  flex-shrink: 0;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--filter-tone, var(--muted));
  white-space: nowrap;
  text-align: center;
}

.filter-range-item {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1 1 180px;
  min-width: 0;
  margin: 0;
}

.filter-range-item > span {
  flex-shrink: 0;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--muted);
}

.filter-range-item .filter-control {
  flex: 1;
  min-width: 0;
  min-height: 32px;
  padding: 6px 8px;
  font-size: 0.8rem;
}

.filter-range-sep {
  flex-shrink: 0;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--filter-tone, var(--muted));
  opacity: 0.75;
}

.filter-range-bar.filter-tone-date-range,
.filter-range-bar.filter-tone-year {
  --filter-tone: #8a05be;
  --filter-tone-soft: #f3e8fa;
  --filter-tone-border: #e4ccf5;
  --filter-tone-ring: rgba(138, 5, 190, 0.12);
}

.filter-range-bar.filter-tone-date-range .filter-control,
.filter-range-bar.filter-tone-year .filter-control {
  border-color: var(--filter-tone-border);
  background: color-mix(in srgb, var(--filter-tone-soft) 58%, white);
}

.filter-range-bar.filter-tone-date-range .filter-control:focus,
.filter-range-bar.filter-tone-year .filter-control:focus {
  border-color: var(--filter-tone);
  box-shadow: 0 0 0 3px var(--filter-tone-ring);
}

.filter-period-summary {
  display: flex;
  align-items: flex-start;
  gap: 10px 14px;
  width: 100%;
  margin-top: 2px;
  padding: 10px 12px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  background: #fafafa;
}

.filter-period-summary-label {
  flex-shrink: 0;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  padding-top: 2px;
}

.filter-period-summary-lines {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  min-width: 0;
}

.filter-period-summary-line {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.35;
  padding: 2px 8px;
  border-radius: 999px;
  background: white;
  border: 1px solid var(--border);
}

.filter-field {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 8px;
  min-width: 0;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-left-width: 4px;
  border-left-color: var(--filter-tone, var(--border));

.filter-field:focus-within {

.filter-tone-year,
.filter-tone-date-range,
.filter-tone-weekday,
.filter-tone-week,
.filter-tone-month,
.filter-tone-day-of-month,
.filter-tone-analyst {
  --filter-tone: #8a05be;
